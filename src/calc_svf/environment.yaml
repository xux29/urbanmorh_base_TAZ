name: fisheye-svf
channels:
  - defaults
  - conda-forge
  - pytorch

dependencies:
  - python=3.10
  - pip
  - numpy>=1.24
  - pillow>=9.0
  - aiohttp>=3.8
  - opencv>=4.7    # conda-forge opencv
  - scikit-image>=0.19
  - matplotlib>=3.6
  - tqdm>=4.65
  - cython
  - pip:
    - transformers>=4.30
    - tokenizers>=0.13
    - torch>=2.0.0         # CPU build by default; see notes below for GPU
    - torchvision>=0.15
    - opencv-python>=4.7   # pip fallback if conda opencv not available
    - aiohttp>=3.8         # ensure pip aiohttp present (conda also provides it)
    - huggingface-hub>=0.14
    - accelerate>=0.20
    - requests>=2.28
    - pillow>=9.0
    - numpy>=1.24

# Notes:
# 1) The `transformers` image-segmentation pipeline requires a deep learning backend (PyTorch or Flax).
#    This environment installs PyTorch (CPU) by default via pip. If you have an NVIDIA GPU and want
#    GPU-accelerated inference, install a CUDA build of PyTorch appropriate for your CUDA version.
#    Example (for CUDA 11.8) run AFTER creating the env:
#      conda activate fisheye-svf
#      conda install pytorch torchvision torchaudio pytorch-cuda=11.8 -c pytorch -c nvidia
#    Or follow the official instructions at https://pytorch.org/get-started/locally/ to pick the
#    correct command for your OS and CUDA version.

# 2) If you prefer to use conda packages for all dependencies, replace the pip section with
#    conda equivalents (some packages like `transformers` may still be installed via pip).

# 3) To create the environment:
#      conda env create -f environment.yaml
#    Then activate it:
#      conda activate fisheye-svf

# 4) If you face any issues with `opencv`/`opencv-python` conflicts, remove the pip `opencv-python`
#    entry and rely on the conda-forge `opencv` package instead:
#      conda install -c conda-forge opencv

# 5) For Windows users without conda, you can create a virtualenv and pip install the pip list:
#      python -m venv venv
#      venv\Scripts\activate
#      pip install -r requirements-pip.txt
#    (I can also generate a requirements-pip.txt if you want.)
